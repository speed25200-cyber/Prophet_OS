# Construit le support d'amorçage de Prophet OS, et exerce l'installeur avant de le livrer.
#
# Deux travaux, dans cet ordre de valeur. L'installeur est le programme le plus dangereux du
# projet : il formate un disque entier. Il est donc exercé pour de vrai — sur un disque en boucle,
# avec partitionnement, chiffrement LUKS2, systèmes de fichiers et montage — avant qu'une image
# qui le contient ne soit publiée. Une ISO dont l'installeur n'a jamais tourné ne vaut rien.

name: Support d'amorçage

on:
  push:
    branches: ["**"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "image/**"
      - ".github/workflows/iso.yml"
      # Le système installé contient les programmes de l'atelier. Les omettre ici voulait dire
      # qu'un crate qui cesse de compiler ne se voyait qu'au moment où quelqu'un installe.
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

jobs:
  # --- L'installeur, exercé sur un disque factice ---
  installeur:
    name: Installeur sur disque en boucle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Outils de disque
        run: |
          sudo apt-get update -qq
          # `whois` apporte `mkpasswd`, dont l'installeur se sert pour hacher le mot de passe du
          # compte. Sur l'image, il vient de l'enveloppe Nix ; ici, le script tourne nu.
          sudo apt-get -y -qq install gdisk cryptsetup-bin btrfs-progs dosfstools parted whois

      - name: Un disque de 100 Gio, creux
        id: disque
        run: |
          # Creux : le fichier n'occupe que ce que les systèmes de fichiers y écrivent vraiment,
          # soit quelques centaines de mégaoctets, et non cent gigaoctets.
          truncate -s 100G /tmp/disque.img
          BOUCLE=$(sudo losetup --find --show --partscan /tmp/disque.img)
          echo "boucle=$BOUCLE" >> "$GITHUB_OUTPUT"
          echo "disque factice : $BOUCLE"

      - name: Refuser sans confirmation
        run: |
          # La première propriété à vérifier n'est pas qu'il formate, c'est qu'il refuse.
          #
          # La sortie est capturée dans un fichier plutôt que passée à `tee` : le code de sortie
          # d'un tube est celui de sa dernière commande, donc `if script | tee` mesurait `tee` et
          # concluait au succès quoi que fasse l'installeur. Le premier essai de ce travail a
          # ainsi déclaré en échec un refus parfaitement correct.
          BOUCLE='${{ steps.disque.outputs.boucle }}'
          set +e
          printf 'nimporte quoi\n' | sudo ./image/installateur/prophet-installer.sh \
            --disque "$BOUCLE" --jusqu-au-montage >/tmp/refus.txt 2>&1
          code=$?
          set -e
          cat /tmp/refus.txt
          if [ "$code" -eq 0 ]; then
            echo "::error::l'installeur a accepté une confirmation qui ne correspondait pas"
            exit 1
          fi
          grep -q "confirmation refusée" /tmp/refus.txt \
            || { echo "::error::le refus n'a pas été motivé"; exit 1; }
          # Et surtout : rien ne doit avoir été écrit.
          if sudo sgdisk --print "$BOUCLE" 2>/dev/null | grep -qE "^ +[0-9]+ "; then
            echo "::error::des partitions existent alors que la confirmation a été refusée"
            exit 1
          fi
          echo "refus correct, disque intact"

      - name: Refuser un disque trop petit
        run: |
          truncate -s 40G /tmp/petit.img
          PETIT=$(sudo losetup --find --show --partscan /tmp/petit.img)
          set +e
          printf '%s\n' "$PETIT" | sudo ./image/installateur/prophet-installer.sh \
            --disque "$PETIT" --jusqu-au-montage >/tmp/petit.txt 2>&1
          code=$?
          set -e
          cat /tmp/petit.txt
          sudo losetup -d "$PETIT"
          if [ "$code" -eq 0 ]; then
            echo "::error::un disque de 40 Gio a été accepté"
            exit 1
          fi
          grep -q "il en faut au moins 80" /tmp/petit.txt \
            || { echo "::error::le refus n'a pas dit la taille attendue"; exit 1; }
          echo "refus correct"

      - name: Préparer le disque pour de vrai
        run: |
          BOUCLE='${{ steps.disque.outputs.boucle }}'
          # La confirmation, la phrase de passe deux fois, puis le mot de passe du compte deux
          # fois : exactement ce qu'un humain tape, dans l'ordre où le script le demande.
          printf '%s\nphrase-de-passe-de-test\nphrase-de-passe-de-test\nmot-de-passe-de-test\nmot-de-passe-de-test\n' "$BOUCLE" \
            | sudo ./image/installateur/prophet-installer.sh --disque "$BOUCLE" --jusqu-au-montage

      - name: Refuser un mot de passe de compte trop court
        run: |
          # Une installation sans mot de passe utilisable produit une machine où personne ne peut
          # ouvrir de session : `root` est verrouillé et `systemd-boot` n'a pas d'éditeur. Il n'y
          # a donc pas de rattrapage après coup, et le refus doit avoir lieu ici.
          truncate -s 100G /tmp/court.img
          COURT=$(sudo losetup --find --show --partscan /tmp/court.img)
          set +e
          printf '%s\nphrase-de-passe-de-test\nphrase-de-passe-de-test\ncourt\ncourt\n' "$COURT" \
            | timeout 60 sudo ./image/installateur/prophet-installer.sh \
                --disque "$COURT" --jusqu-au-montage >/tmp/court.txt 2>&1
          code=$?
          set -e
          cat /tmp/court.txt
          sudo losetup -d "$COURT" 2>/dev/null || true
          if [ "$code" -eq 0 ]; then
            echo "::error::un mot de passe de cinq caractères a été accepté"
            exit 1
          fi
          grep -q "huit caractères au minimum" /tmp/court.txt \
            || { echo "::error::le refus n'a pas dit ce qui manquait"; exit 1; }
          echo "refus correct"

      - name: Vérifier ce qui a été posé
        run: |
          BOUCLE='${{ steps.disque.outputs.boucle }}'
          echo "--- disposition ---"
          lsblk -o NAME,SIZE,FSTYPE,LABEL,MOUNTPOINT "$BOUCLE"
          echo "--- étiquettes attendues par immutable.nix ---"
          manque=0
          for etiquette in prophet-a prophet-b PROPHET-EFI; do
            if lsblk -no LABEL "$BOUCLE" | grep -qx "$etiquette"; then
              echo "  ✓ $etiquette"
            else
              echo "  ✗ $etiquette absente"; manque=1
            fi
          done
          # Les volumes chiffrés portent leur étiquette dans l'en-tête LUKS2, pas dans un système
          # de fichiers : c'est par elle qu'immutable.nix les désigne.
          for nom in prophet-state prophet-home; do
            if sudo cryptsetup luksDump "$(sudo blkid -t PARTLABEL="$nom" -o device)" \
                 | grep -q "Label:.*${nom}-luks"; then
              echo "  ✓ ${nom}-luks (en-tête LUKS2)"
            else
              echo "  ✗ ${nom}-luks absente de l'en-tête"; manque=1
            fi
          done
          echo "--- montages ---"
          for point in /mnt /mnt/boot /mnt/home /mnt/var/lib/prophet; do
            if mountpoint -q "$point"; then echo "  ✓ $point"; else echo "  ✗ $point"; manque=1; fi
          done
          [ "$manque" = "0" ] || { echo "::error::la disposition ne correspond pas à immutable.nix"; exit 1; }
          echo "la disposition correspond à ce que le système attend au démarrage"

      - name: Ranger
        if: always()
        run: |
          sudo umount -R /mnt 2>/dev/null || true
          sudo cryptsetup close prophet-home 2>/dev/null || true
          sudo cryptsetup close prophet-state 2>/dev/null || true
          sudo losetup -D 2>/dev/null || true

  # --- L'image elle-même ---
  iso:
    name: Construire l'ISO
    needs: installeur
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Faire de la place
        # Une image amorçable et son magasin Nix ne tiennent pas dans ce qu'un coureur laisse
        # libre par défaut.
        run: |
          echo "avant : $(df -h / | awk 'NR==2{print $4}') libres"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "après : $(df -h / | awk 'NR==2{print $4}') libres"

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            max-jobs = auto

      - name: Évaluer la configuration avant de construire
        # Évaluer coûte des secondes, construire coûte une heure. Une option mal écrite doit
        # arrêter le travail au début, pas à la fin.
        run: |
          nix eval --raw .#nixosConfigurations.prophet-iso.config.system.build.isoImage.drvPath
          echo
          echo "évaluation de la configuration installée (celle que l'installeur posera) :"
          nix eval --raw .#nixosConfigurations.prophet.config.system.build.toplevel.drvPath

      - name: Construire l'image
        run: nix build .#iso --print-build-logs

      - name: Ce qui a été produit
        id: image
        run: |
          CHEMIN=$(readlink -f result)/iso
          FICHIER=$(ls "$CHEMIN"/*.iso | head -1)
          NOM=$(basename "$FICHIER")
          cp "$FICHIER" "./$NOM"
          sha256sum "$NOM" | tee "$NOM.sha256"
          ls -lh "$NOM"
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"

      - name: Publier l'image
        uses: actions/upload-artifact@v4
        with:
          name: prophet-os-iso
          path: |
            *.iso
            *.iso.sha256
          retention-days: 30
          compression-level: 0

  # --- Le système que l'installeur posera ---
  #
  # L'ISO ne contient que la source : c'est `nixos-install` qui compile, sur la machine de
  # l'utilisateur, au moment de l'installation. Rien ne vérifiait donc que cette compilation
  # aboutisse — l'ISO se construisait, l'installeur posait les partitions, et l'échec serait
  # survenu chez lui, à mi-chemin, sur une machine dont le disque est déjà effacé.
  #
  # L'évaluation, que le travail « iso » fait déjà, attrape une option mal écrite. Elle n'attrape
  # ni un crate qui ne compile plus, ni un programme absent : pour cela il faut construire.
  systeme:
    name: Construire le système installé
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Faire de la place
        run: |
          echo "avant : $(df -h / | awk 'NR==2{print $4}') libres"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "après : $(df -h / | awk 'NR==2{print $4}') libres"

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            max-jobs = auto

      - name: Construire
        run: |
          nix build .#nixosConfigurations.prophet.config.system.build.toplevel \
            --print-build-logs --out-link systeme

      - name: Les sept services pointent-ils vers un programme qui existe ?
        # Le contrôle que `tools/verifier-les-services.sh` fait sur les noms, refait ici sur les
        # chemins réels du magasin. C'est le seul endroit où l'on peut vraiment ouvrir le fichier
        # que systemd lancera.
        run: |
          manque=0
          for unite in systeme/etc/systemd/system/prophet-*.service; do
            [ -e "$unite" ] || continue
            nom=$(basename "$unite")
            # `ExecStart=` peut être précédé d'un `-` ou d'un `@` ; on prend le premier mot qui
            # ressemble à un chemin du magasin.
            programme=$(grep -m1 '^ExecStart=' "$unite" \
              | sed 's/^ExecStart=[-@+!]*//' | awk '{print $1}')
            if [ -x "$programme" ]; then
              printf '  ✓ %-34s %s\n' "$nom" "$(basename "$programme")"
            else
              printf '  ✗ %-34s %s introuvable ou non exécutable\n' "$nom" "$programme"
              manque=$((manque + 1))
            fi
          done
          echo
          if [ "$manque" -gt 0 ]; then
            echo "::error::$manque service(s) pointent vers un programme absent du système construit"
            exit 1
          fi
          echo "chaque service installé pointe vers un programme présent et exécutable"

      - name: Ce que pèse le système
        run: |
          echo "fermeture : $(nix path-info -Sh ./systeme | awk '{print $2}')"

  # --- Voir l'image démarrer ---
  #
  # M9-T6. Jusqu'ici l'ISO se construisait sans que personne ne l'ait jamais vue démarrer : on
  # savait produire un fichier, pas un système qui s'allume. La différence entre les deux est
  # exactement ce qu'un utilisateur découvre en effaçant son disque.
  #
  # La machine virtuelle démarre en UEFI, sans écran, et raconte son démarrage sur la console
  # série. On attend le message d'accueil — celui qui dit quoi taper. Le voir apparaître veut dire
  # que le micrologiciel a trouvé l'image, que le noyau a démarré, que l'espace utilisateur est
  # monté, et que `getty` sert une invite. C'est tout ce qu'on peut vérifier sans main humaine, et
  # c'est bien plus que rien.
  demarrage:
    name: Voir l'image démarrer
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Outils de machine virtuelle
        run: |
          sudo apt-get update -qq
          sudo apt-get -y -qq install qemu-system-x86 ovmf
          # KVM accélère beaucoup, mais son absence ne doit pas faire échouer le test : QEMU sait
          # émuler. On regarde donc si on peut *ouvrir* le périphérique, pas s'il existe.
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "ACCEL=-enable-kvm -cpu host" >> "$GITHUB_ENV"
            echo "KVM utilisable : démarrage accéléré"
          else
            echo "ACCEL=" >> "$GITHUB_ENV"
            echo "::warning::/dev/kvm inutilisable — émulation logicielle, c'est plus lent"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: prophet-os-iso

      - name: Démarrer, et écouter
        run: |
          ISO=$(ls ./*.iso | head -1)
          echo "image : $ISO ($(du -h "$ISO" | cut -f1))"

          # Le micrologiciel est recopié : QEMU a besoin d'un OVMF_VARS inscriptible.
          cp /usr/share/OVMF/OVMF_VARS_4M.fd ./vars.fd 2>/dev/null \
            || cp /usr/share/OVMF/OVMF_VARS.fd ./vars.fd
          CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          [ -f "$CODE" ] || CODE=/usr/share/OVMF/OVMF_CODE.fd

          # La machine virtuelle ne s'arrête pas toute seule : elle démarre et attend devant une
          # invite, ce qui est exactement ce qu'on veut d'un support d'installation. On la lance
          # donc en fond et on l'arrête dès qu'elle a prouvé ce qu'on lui demande, plutôt que
          # d'attendre une échéance que rien ne déclenchera.
          qemu-system-x86_64 $ACCEL -m 3072 -smp 2 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,unit=1,file=./vars.fd \
            -cdrom "$ISO" -boot d \
            -display none -serial stdio -no-reboot > demarrage.log 2>&1 &
          VM=$!

          for _ in $(seq 1 180); do
            grep -q "support d'installation" demarrage.log && break
            # Une machine virtuelle morte ne dira plus rien : inutile d'attendre l'échéance.
            kill -0 "$VM" 2>/dev/null || { echo "la machine virtuelle s'est arrêtée seule"; break; }
            sleep 5
          done

          kill "$VM" 2>/dev/null || true
          wait "$VM" 2>/dev/null || true
          echo "--- 80 dernières lignes ---"
          tail -80 demarrage.log

      - name: Est-ce que ça a démarré ?
        run: |
          manque=0

          # Trois preuves, du plus bas au plus haut. Ne vérifier que la dernière rendrait un échec
          # précoce indiscernable d'un échec tardif.
          #
          # Chacune est une chose que seul le franchissement de l'étape peut produire, et non un
          # indice qui l'accompagne d'ordinaire. La première version de ce contrôle cherchait
          # « Linux version » sur la console série et concluait, faute de l'y trouver, que le noyau
          # n'avait pas démarré — alors que le message d'accueil, qui ne peut apparaître qu'après
          # lui, était juste en dessous. Le noyau avait démarré ; c'est son niveau de journal qui
          # taisait cette ligne.
          grep -q "BdsDxe: starting Boot" demarrage.log \
            || { echo "::error::le micrologiciel n'a pas trouvé de quoi démarrer sur l'image"; manque=1; }
          # Cette bannière est écrite par `agetty` : elle ne peut exister que si le noyau a
          # démarré, que si l'espace utilisateur est monté, et que si systemd a lancé un terminal.
          grep -q "Welcome to NixOS" demarrage.log \
            || { echo "::error::aucun terminal n'a été servi : le démarrage s'est arrêté avant"; manque=1; }
          grep -q "support d'installation" demarrage.log \
            || { echo "::error::le message d'accueil n'est jamais apparu"; manque=1; }

          if [ "$manque" != "0" ]; then
            echo "::error::cette image ne démarre pas ; ne la gravez pas"
            exit 1
          fi
          echo
          echo "L'image démarre : le micrologiciel la trouve, et elle sert une invite qui dit quoi taper."
          # Sans valeur de vérité, mais précieux quand le reste échoue un jour.
          grep -q "Linux version" demarrage.log \
            && echo "(le noyau raconte aussi son démarrage sur la console série)"

      - name: Conserver la trace du démarrage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demarrage-vm
          path: demarrage.log
          if-no-files-found: warn

  # --- Les services, sur une vraie machine ---
  #
  # Les tests Rust lancent chaque binaire à la main, sous le compte de celui qui teste. Sur la
  # machine installée, chaque daemon tourne sous son utilisateur, avec ProtectSystem strict, un
  # filtre d'appels système, des capacités retirées et un socket en 0660. Rien de tout cela n'est
  # exercé par un test Rust — et c'est exactement la forme du défaut qui a occupé cette journée.
  services:
    name: Les sept services sous systemd
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Faire de la place
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "$(df -h / | awk 'NR==2{print $4}') libres"

      - name: Rendre /dev/kvm ouvrable
        # Sur un coureur GitHub, `/dev/kvm` existe mais appartient au groupe `kvm`, dont
        # l'utilisateur du coureur ne fait pas partie : il est présent et refusé. Le constater et
        # s'arrêter là — ce que faisait la première version de cette étape — revenait à demander à
        # la machine une permission qu'on sait comment obtenir. L'outil du dépôt la donne, et
        # vérifie ensuite qu'elle est bien donnée.
        run: PROPHET_AUTORISER_KVM=1 sudo -E ./tools/install-isolation.sh microvm

      - name: Vérifier qu'il l'est
        # Un test NixOS sans KVM est si lent qu'il expirerait. On essaie d'ouvrir, on ne regarde
        # pas si le fichier est là.
        run: |
          python3 -c "open('/dev/kvm','r+b').close()" \
            || { echo "::error::/dev/kvm reste inouvrable : ce test a besoin de virtualisation"; exit 1; }
          echo "/dev/kvm ouvrable"

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            max-jobs = auto

      - name: Démarrer la machine et exercer les services
        run: nix build .#checks.x86_64-linux.services --print-build-logs

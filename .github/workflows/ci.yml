name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Une poussée remplace la précédente. Chaque exécution occupe six coureurs pendant une demi-heure ;
# les laisser s'empiler fait attendre celle qui compte — la dernière — derrière des versions que
# plus personne ne regarde. Les travaux annulés n'apprennent rien à personne.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Historique complet, pour gitleaks. Il scanne la plage `<premier poussé>^..<dernier>` ;
      # avec le clone superficiel par défaut, le parent du premier commit n'existe pas, git
      # refuse la plage, et l'action sort en échec après avoir scanné zéro octet. L'échec
      # ressemble alors à une fuite détectée alors que rien n'a été regardé — le pire des
      # messages, puisqu'il fait chercher un secret qui n'existe pas.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pas d'action de chaîne d'outils : rustup lit rust-toolchain.toml, donc la CI et une
      # machine de développement compilent avec exactement la même version. Installer « stable »
      # ici laissait les deux dériver, et des lints n'apparaissaient qu'en CI.
      - name: Chaîne d'outils du dépôt
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Ubuntu 24.04 interdit par AppArmor d'exécuter quoi que ce soit dans un espace de noms
      # créé par un programme non listé. La création réussit, l'exécution non, et l'échec sort
      # sous la forme d'un EACCES nu dans un composant qui n'y est pour rien. C'est la cause
      # unique des échecs des niveaux 0 et 1 sur ce coureur.
      - name: Lever la restriction des espaces de noms
        run: PROPHET_AUTORISER_USERNS=1 sudo -E ./tools/install-isolation.sh userns
      # Les sept services de l'image ont chacun leur programme. Ce contrôle est en tête parce
      # qu'il coûte une seconde et qu'il attrape un défaut que rien d'autre ne voit : un
      # `ExecStart` peut nommer un binaire inexistant sans que Nix, cargo ou systemd ne s'en
      # aperçoivent avant le démarrage de la machine installée.
      - name: Services déclarés et programmes produits
        run: ./tools/verifier-les-services.sh
      # Même raison, autre défaut : un service peut recevoir une capacité que son filtre d'appels
      # système lui refuse ensuite. Ni Nix, ni systemd, ni le démarrage du service ne le signalent
      # — seul le premier essai réel le dit, et il a fallu sept minutes de machine virtuelle pour
      # l'apprendre la première fois, sous la forme « écriture de uid_map : Operation not
      # permitted ». Ce contrôle-ci le dit en une seconde.
      - name: Capacités accordées et appels système permis
        run: ./tools/verifier-le-durcissement.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace
        env:
          # Sans navigateur, les tests du pont CDP passent sans rien essayer. Ici, le vert doit
          # vouloir dire qu'ils ont tourné.
          PROPHET_EXIGER_NAVIGATEUR: "1"
      - name: Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # La surface d'observation, rendue pour de vrai.
  #
  # Le conteneur de développement n'a aucun adaptateur graphique : la surface y compile mais ne s'y
  # dessine jamais. Un coureur avec `lavapipe` — le rastériseur logiciel de Mesa — suffit à
  # l'exercer, et le rendu hors écran rend l'image téléchargeable. Une interface qu'on ne peut
  # montrer qu'en la faisant tourner ne se vérifie pas et ne se discute pas.
  surface:
    name: Surface d'observation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chaîne d'outils du dépôt
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Rendu logiciel et polices
        run: |
          sudo apt-get update -qq
          sudo apt-get -y -qq install mesa-vulkan-drivers vulkan-tools fonts-dejavu-core

      # Sans adaptateur, les tests marqués needs_gpu se contenteraient d'être ignorés et le
      # travail passerait au vert sans avoir rien dessiné. Sans police, le texte disparaîtrait
      # d'une image qui paraîtrait correcte. Les deux sont donc exigés.
      - name: Exiger un adaptateur et une police
        run: |
          if ! vulkaninfo --summary 2>/dev/null | grep -qi "llvmpipe\|lavapipe"; then
            echo "::error::aucun rastériseur logiciel Vulkan : la surface ne serait pas exercée."
            vulkaninfo --summary 2>&1 | head -30
            exit 1
          fi
          fc-list | head -3
          test "$(fc-list | wc -l)" -gt 0 || { echo "::error::aucune police installée"; exit 1; }

      - name: Exercer la surface
        run: cargo test -p surface --release -- --ignored --test-threads=1 --nocapture

      - name: Capturer les deux états
        run: |
          cargo run --release -p surface --bin prophet-surface -- \
            --capture surface-contemplation.png
          cargo run --release -p surface --bin prophet-surface -- \
            --capture surface-decision.png --decision
          ls -lh surface-*.png

      - name: Publier les images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface
          path: surface-*.png
          retention-days: 30

  # Les tests matériels tournent ici et nulle part ailleurs : le conteneur de développement n'a ni
  # gVisor ni KVM, et les coureurs GitHub ont les deux une fois gVisor installé. C'est donc la
  # seule machine où les niveaux 1 et 2 sont réellement exercés.
  isolation:
    name: Niveaux d'isolation (matériel réel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chaîne d'outils du dépôt
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # Ubuntu 24.04 interdit par AppArmor d'exécuter quoi que ce soit dans un espace de noms
      # créé par un programme non listé. La création réussit, l'exécution non, et l'échec sort
      # sous la forme d'un EACCES nu dans un composant qui n'y est pour rien. C'est la cause
      # unique des échecs des niveaux 0 et 1 sur ce coureur.
      - name: Lever la restriction des espaces de noms
        run: PROPHET_AUTORISER_USERNS=1 sudo -E ./tools/install-isolation.sh userns

      # Les tests de niveau 0 se taisent et passent quand les espaces de noms manquent : c'est le
      # bon comportement dans un conteneur de développement, mais sur ce coureur il ferait verdir
      # la suite de « check » sans que rien ait été confiné. On exige donc ce que le silence
      # cacherait.
      - name: Exiger les espaces de noms utilisateur
        run: |
          # On teste la création de l'espace de noms, pas la projection d'identifiants depuis
          # l'intérieur : le noyau refuse cette dernière ici, et Prophet OS ne la fait pas non
          # plus — il écrit la projection depuis le parent (ADR-0005). Tester --map-root-user
          # reviendrait à exiger ce que le système ne fait volontairement pas.
          if ! unshare --user true; then
            echo "::error::espaces de noms utilisateur indisponibles : les tests de niveau 0 se"
            echo "::error::contenteraient de se taire, et le vert de « check » ne prouverait rien."
            exit 1
          fi
          # `unshare` figure dans les profils AppArmor livrés par Ubuntu : il passe même sous
          # restriction. La garde le vérifierait donc avec succès pendant que tout le reste
          # échoue. On contrôle aussi le réglage lui-même.
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -f "$restriction" ] && [ "$(cat "$restriction")" = "1" ]; then
            echo "::error::la restriction AppArmor des espaces de noms est toujours active :"
            echo "::error::les niveaux 0 et 1 échoueront sur EACCES, quoi que dise unshare."
            exit 1
          fi
          echo "espaces de noms utilisateur disponibles, sans restriction de politique"

      - name: Installer gVisor
        run: sudo ./tools/install-isolation.sh gvisor

      # Une installation ratée ferait glisser le niveau 1 en « non vérifiable », et le job
      # passerait au vert sans avoir rien prouvé. Sur ce coureur, gVisor doit être là : on l'exige
      # plutôt que de laisser le silence tenir lieu de résultat.
      - name: Exiger gVisor
        run: |
          command -v runsc >/dev/null || {
            echo "::error::gVisor devait être installé sur ce coureur et ne l'est pas ;"
            echo "::error::sans cette exigence, le niveau 1 deviendrait « non vérifiable » en silence."
            exit 1
          }
          runsc --version

      # Le niveau 2 dépend d'artefacts publiés par un tiers, dont les chemins bougent. On essaie,
      # et si les images ne viennent pas le script de vérification le rangera en « non vérifiable »
      # — ce qui est dit dans le rapport, jamais compté réussi.
      - name: Installer Firecracker et les images d'invité (au mieux)
        continue-on-error: true
        # /dev/kvm est présent sur ce coureur mais appartient au groupe kvm, dont l'utilisateur
        # courant ne fait pas partie : Firecracker mourait sur EACCES. Le coureur est jetable,
        # l'accès est donc accordé explicitement.
        run: PROPHET_AUTORISER_KVM=1 sudo -E ./tools/install-isolation.sh microvm

      - name: Niveaux d'isolation
        run: ./tools/verify-on-host.sh --niveaux
        env:
          RAPPORT: rapport-isolation.md

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-isolation
          path: rapport-isolation.md

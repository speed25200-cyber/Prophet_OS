name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Une poussée remplace la précédente. Chaque exécution occupe six coureurs pendant une demi-heure ;
# les laisser s'empiler fait attendre celle qui compte — la dernière — derrière des versions que
# plus personne ne regarde. Les travaux annulés n'apprennent rien à personne.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-engine-system:
    name: Mission locale sous NixOS (modèle réel)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Préparer KVM
        run: |
          PROPHET_AUTORISER_KVM=1 sudo -E ./tools/install-isolation.sh kvm
          python3 -c "open('/dev/kvm', 'r+b').close()"
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            max-jobs = 1
            cores = 2
      - name: Charger Qwen3 et exercer les services installés
        run: nix build .#local-engine-vm --print-build-logs

  local-engine:
    name: Moteur local (protocole)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            max-jobs = 1
            cores = 2
      - name: Vérifier la grammaire et le parseur du moteur corrigé
        run: nix build .#checks.x86_64-linux.llama-tool-grammar --print-build-logs
      # Le routeur tel que l'image le lance en mode relais : préréglages avec section globale et
      # dossier des poids téléchargés (ADR 0046). Aucun essai en VM n'exerce ce mode.
      - name: Vérifier le routeur du moteur et son dossier de poids
        run: nix build .#checks.x86_64-linux.llama-router --print-build-logs
      # La variante Vulkan du moteur (ADR 0037) : aucun coureur n'a de carte, mais elle doit
      # compiler à chaque poussée, avec le même correctif, pour qu'une machine à carte la
      # reçoive sans surprise.
      - name: Construire le moteur avec le backend Vulkan
        run: nix build .#llama-cpp-vulkan --print-build-logs

  # Le critère de M8-T7 (ADR 0046), par les vrais binaires : `prophet model pull qwen3-8b-q4`
  # par agentd, capd et egress depuis Hugging Face, le routeur épinglé lancé comme l'image le
  # lance, `prophet model serve`, puis une complétion. Aucune autre machine du dépôt n'a à la
  # fois le moteur, le réseau et la place pour 5 Go.
  poids:
    name: Poids du catalogue servis (réels)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            max-jobs = 1
            cores = 2
      - name: Construire le moteur épinglé
        run: nix build .#llama-cpp --out-link moteur --print-build-logs
      - name: Chaîne d'outils du dépôt
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Construire les services et la CLI
        run: cargo build -p capd -p ledger -p egress -p agentd -p prophet-cli --bins
      - name: Télécharger, servir et interroger qwen3-8b-q4
        env:
          PROPHET_TEST_LLAMA_SERVER: ${{ github.workspace }}/moteur/bin/llama-server
        run: cargo test -p agentd --test poids -- --ignored --nocapture le_critere_pull_serve_puis_une_completion
      # FRONTIER : valider des modèles de plusieurs familles, sur processeur.
      - name: Servir et interroger Granite, SmolLM2, Phi-3 et Llama 3.2
        env:
          PROPHET_TEST_LLAMA_SERVER: ${{ github.workspace }}/moteur/bin/llama-server
        run: cargo test -p agentd --test poids -- --ignored --nocapture plusieurs_familles_se_servent_et_repondent
      # FRONTIER : concurrence et annulation, sur une instance à une place comme l'image.
      - name: Deux requêtes ensemble, puis un abandon qui libère le moteur
        env:
          PROPHET_TEST_LLAMA_SERVER: ${{ github.workspace }}/moteur/bin/llama-server
        run: cargo test -p agentd --test poids -- --ignored --nocapture deux_requetes_se_partagent_le_moteur_et_un_abandon_le_libere
      # M13 et FRONTIER : la suite de tâches jouée par le vrai modèle de l'image, à travers
      # Prophet et à travers une boucle nue — même modèle, mêmes outils, mêmes vérificateurs.
      - name: Banc M13 — la suite par Prophet et par une boucle nue
        env:
          PROPHET_TEST_LLAMA_SERVER: ${{ github.workspace }}/moteur/bin/llama-server
          PROPHET_BENCH_RESULTS: ${{ github.workspace }}/banc.json
          PROPHET_BENCH_REPETITIONS: "3"
        run: |
          cargo test -p bench --test suite_reelle -- --ignored --nocapture la_suite_se_joue 2>&1 | tee banc.log
          {
            echo "## Banc M13 — Prophet et boucle nue, même modèle"
            echo '```'
            grep '^mesure : banc' banc.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Conserver les résultats du banc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banc-m13
          path: |
            banc.json
            banc.log
          if-no-files-found: warn
          retention-days: 30

  chatgpt:
    name: ChatGPT sous NixOS (compatibilité)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Préparer la virtualisation du test
        run: |
          PROPHET_AUTORISER_KVM=1 sudo -E ./tools/install-isolation.sh kvm
          python3 -c "open('/dev/kvm', 'r+b').close()"
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            max-jobs = 2
            cores = 2
      - name: Ouvrir le client officiel dans une session Sway et XWayland
        run: |
          mkdir -p chatgpt-diagnostics
          test_output=$(nix eval --raw .#checks.x86_64-linux.chatgpt-desktop.outPath)
          status=0
          nix build .#checks.x86_64-linux.chatgpt-desktop --print-build-logs --keep-failed --out-link result-chatgpt || status=$?
          if [ -d "$test_output" ]; then
            find "$test_output" -maxdepth 1 -name '*.png' -exec cp -- {} chatgpt-diagnostics/ \;
          fi
          exit "$status"
      - name: Publier les captures de la VM sans compte connecté
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-nixos
          path: chatgpt-diagnostics/*.png
          if-no-files-found: warn
          retention-days: 14

  check:
    runs-on: ubuntu-latest
    steps:
      # Historique complet, pour gitleaks. Il scanne la plage `<premier poussé>^..<dernier>` ;
      # avec le clone superficiel par défaut, le parent du premier commit n'existe pas, git
      # refuse la plage, et l'action sort en échec après avoir scanné zéro octet. L'échec
      # ressemble alors à une fuite détectée alors que rien n'a été regardé — le pire des
      # messages, puisqu'il fait chercher un secret qui n'existe pas.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pas d'action de chaîne d'outils : rustup lit rust-toolchain.toml, donc la CI et une
      # machine de développement compilent avec exactement la même version. Installer « stable »
      # ici laissait les deux dériver, et des lints n'apparaissaient qu'en CI.
      - name: Chaîne d'outils du dépôt
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Ubuntu 24.04 interdit par AppArmor d'exécuter quoi que ce soit dans un espace de noms
      # créé par un programme non listé. La création réussit, l'exécution non, et l'échec sort
      # sous la forme d'un EACCES nu dans un composant qui n'y est pour rien. C'est la cause
      # unique des échecs des niveaux 0 et 1 sur ce coureur.
      - name: Lever la restriction des espaces de noms
        run: PROPHET_AUTORISER_USERNS=1 sudo -E ./tools/install-isolation.sh userns
      # Les sept services de l'image ont chacun leur programme. Ce contrôle est en tête parce
      # qu'il coûte une seconde et qu'il attrape un défaut que rien d'autre ne voit : un
      # `ExecStart` peut nommer un binaire inexistant sans que Nix, cargo ou systemd ne s'en
      # aperçoivent avant le démarrage de la machine installée.
      - name: Services déclarés et programmes produits
        run: ./tools/verifier-les-services.sh
      # Même raison, autre défaut : un service peut recevoir une capacité que son filtre d'appels
      # système lui refuse ensuite. Ni Nix, ni systemd, ni le démarrage du service ne le signalent
      # — seul le premier essai réel le dit, et il a fallu sept minutes de machine virtuelle pour
      # l'apprendre la première fois, sous la forme « écriture de uid_map : Operation not
      # permitted ». Ce contrôle-ci le dit en une seconde.
      - name: Capacités accordées et appels système permis
        run: ./tools/verifier-le-durcissement.sh
      # Le guide d'installation demande de vérifier les travaux d'une exécution avant de graver.
      # Son tableau a pris du retard une fois : il annonçait cinq travaux quand il y en avait
      # sept. Une consigne en retard est pire qu'une consigne absente — elle donne la confiance
      # sans la vérification.
      - name: Travaux décrits dans le guide d'installation
        run: ./tools/verifier-la-doc-des-travaux.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: |
          cargo build --workspace --bins
          cargo test --workspace
        env:
          # Sans navigateur, les tests du pont CDP passent sans rien essayer. Ici, le vert doit
          # vouloir dire qu'ils ont tourné.
          PROPHET_EXIGER_NAVIGATEUR: "1"
      - name: Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # La surface d'observation, rendue pour de vrai.
  #
  # Le conteneur de développement n'a aucun adaptateur graphique : la surface y compile mais ne s'y
  # dessine jamais. Un coureur avec `lavapipe` — le rastériseur logiciel de Mesa — suffit à
  # l'exercer, et le rendu hors écran rend l'image téléchargeable. Une interface qu'on ne peut
  # montrer qu'en la faisant tourner ne se vérifie pas et ne se discute pas.
  surface:
    name: Surface d'observation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chaîne d'outils du dépôt
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Rendu logiciel et polices
        run: |
          sudo apt-get update -qq
          sudo apt-get -y -qq install mesa-vulkan-drivers vulkan-tools fonts-dejavu-core

      # Sans adaptateur, les tests marqués needs_gpu se contenteraient d'être ignorés et le
      # travail passerait au vert sans avoir rien dessiné. Sans police, le texte disparaîtrait
      # d'une image qui paraîtrait correcte. Les deux sont donc exigés.
      - name: Exiger un adaptateur et une police
        run: |
          if ! vulkaninfo --summary 2>/dev/null | grep -qi "llvmpipe\|lavapipe"; then
            echo "::error::aucun rastériseur logiciel Vulkan : la surface ne serait pas exercée."
            vulkaninfo --summary 2>&1 | head -30
            exit 1
          fi
          fc-list | head -3
          test "$(fc-list | wc -l)" -gt 0 || { echo "::error::aucune police installée"; exit 1; }

      - name: Construire les services du parcours de supervision
        run: cargo build --release -p agentd -p capd -p ledger --bins

      # Tous les essais ignorés de la surface, sauf celui de l'écoute permanente : il lui faut
      # Whisper, Piper et un modèle de parole, que le travail « Parole » apporte et exerce.
      - name: Exercer la surface
        env:
          PROPHET_CAPTURE_DIR: ${{ github.workspace }}
        run: cargo test -p surface --release -- --ignored --test-threads=1 --nocapture --skip l_ecoute_permanente

      # Le champ est allégé de lui-même sur un rastériseur logiciel ; les captures le montrent
      # complet, tel qu'une carte graphique le trace, pour qu'on juge ce que l'utilisateur verra.
      - name: Capturer les états, les tailles et les accents de l'espace natif
        run: |
          S="cargo run --release -p surface --bin prophet-surface --"
          $S --capture surface-missions.png --demonstration --champ-complet --largeur 1920 --hauteur 1080
          $S --capture surface-decision.png --demonstration --decision --champ-complet
          $S --capture surface-examen.png --demonstration --decision --examen --champ-complet --largeur 1440 --hauteur 1000
          $S --capture surface-compacte.png --largeur 640 --hauteur 900 --demonstration --champ-complet
          $S --capture surface-systeme.png --page activite --demonstration --champ-complet --largeur 1440 --hauteur 1000
          $S --capture surface-modele-absent.png --page modeles --endpoint http://127.0.0.1:1/v1
          for accent in or plasma jade nacre; do
            $S --capture "surface-accent-$accent.png" --demonstration --champ-complet --accent "$accent" --largeur 1440 --hauteur 1000
          done
          ls -lh surface-*.png

      # Les mesures du critère d'interface, sur ce coureur : un processeur qui rastérise, et il
      # le dit. Les mêmes commandes, sur une machine avec carte graphique, mesurent la carte.
      - name: Mesurer le rendu et la consommation au repos
        run: |
          S="cargo run --release -p surface --bin prophet-surface --"
          {
            echo "## Rendu, rastériseur logiciel du coureur"
            echo '```'
            echo "# cinq missions de démonstration, champ allégé (défaut sur rastériseur logiciel)"
            $S --mesure 120 --demonstration --largeur 1920 --hauteur 1080
            echo
            echo "# cinq missions de démonstration, champ complet"
            $S --mesure 120 --demonstration --champ-complet --largeur 1920 --hauteur 1080
            echo
            echo "# aucune mission, services absents"
            PROPHET_AGENTD_SOCKET=/nonexistent/agentd.sock $S --mesure 120 --largeur 1920 --hauteur 1080 --endpoint http://127.0.0.1:1/v1
            echo
            echo "# repos : cinq missions, mouvement réduit, dix secondes"
            $S --repos 10 --demonstration --mouvement-reduit --largeur 1920 --hauteur 1080
            echo
            echo "# activité : cinq missions, champ vivant, dix secondes"
            $S --repos 10 --demonstration --largeur 1920 --hauteur 1080
            echo
            echo "# conversation en flux : 30 fragments du moteur, images composées pendant la génération"
            cargo test -q -p surface --release --test bureau la_surface_ne_bloque_pas_pendant_une_generation_en_flux -- --ignored --nocapture 2>&1 | grep '^mesure'
            echo '```'
          } 2>/dev/null | tee surface-mesures.md
          cat surface-mesures.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les images et les mesures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface
          path: |
            surface-*.png
            surface-mesures.md
          retention-days: 30

  # Les tests matériels tournent ici et nulle part ailleurs : le conteneur de développement n'a ni
  # gVisor ni KVM, et les coureurs GitHub ont les deux une fois gVisor installé. C'est donc la
  # seule machine où les niveaux 1 et 2 sont réellement exercés.
  # La parole, avec les vrais programmes : Whisper (whisper.cpp) écoute, Piper parle. Les essais
  # marqués needs_voice_stack sont ignorés partout ailleurs — ils exigent un modèle de 148 Mo et
  # une voix — ; ici ils tournent, et le vert veut dire que l'humain peut dicter une mission,
  # dire « Prophète, … » sans bouton, et entendre la réponse de l'OS, sans réseau (ADR 0036).
  # Les programmes, le modèle et la voix viennent du flake, les mêmes que dans l'image.
  voice:
    name: Parole (Whisper et Piper réels)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Chaîne d'outils du dépôt
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
      - name: Les programmes, le modèle et la voix
        run: |
          nix build .#chaine-vocale --print-build-logs -o chaine-vocale
          ls -lL chaine-vocale/bin chaine-vocale/share/prophet chaine-vocale/share/prophet/voix
          {
            echo "PROPHET_WHISPER=$PWD/chaine-vocale/bin/whisper-cli"
            echo "PROPHET_PIPER=$PWD/chaine-vocale/bin/piper"
            echo "PROPHET_TEST_ESPEAK=$PWD/chaine-vocale/bin/espeak-ng"
            echo "PROPHET_WHISPER_MODEL=$PWD/chaine-vocale/share/prophet/ggml-base.bin"
            echo "PROPHET_PIPER_VOICE=$PWD/chaine-vocale/share/prophet/voix/fr_FR-siwis-medium.onnx"
          } >> "$GITHUB_ENV"
      - name: L'OS écoute une phrase, parle, et se réécoute
        run: cargo test -p voice --test dictee -- --ignored --nocapture --test-threads=1
      # Un essai à la fois : chacun fait tourner Whisper et Piper sur tous les cœurs, et deux
      # essais en même temps se ralentissent jusqu'à dépasser l'attente du service simulé.
      - name: Une phrase dite devient une mission ; « Prophète, … » la déclenche
        run: cargo test -p prophet-cli --test task_service -- --ignored --nocapture --test-threads=1
      - name: L'atelier écoute « Prophète » sans bouton
        run: cargo test -p surface --lib -- --ignored --nocapture --test-threads=1

  isolation:
    name: Niveaux d'isolation (matériel réel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chaîne d'outils du dépôt
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # Ubuntu 24.04 interdit par AppArmor d'exécuter quoi que ce soit dans un espace de noms
      # créé par un programme non listé. La création réussit, l'exécution non, et l'échec sort
      # sous la forme d'un EACCES nu dans un composant qui n'y est pour rien. C'est la cause
      # unique des échecs des niveaux 0 et 1 sur ce coureur.
      - name: Lever la restriction des espaces de noms
        run: PROPHET_AUTORISER_USERNS=1 sudo -E ./tools/install-isolation.sh userns

      # Les tests de niveau 0 se taisent et passent quand les espaces de noms manquent : c'est le
      # bon comportement dans un conteneur de développement, mais sur ce coureur il ferait verdir
      # la suite de « check » sans que rien ait été confiné. On exige donc ce que le silence
      # cacherait.
      - name: Exiger les espaces de noms utilisateur
        run: |
          # On teste la création de l'espace de noms, pas la projection d'identifiants depuis
          # l'intérieur : le noyau refuse cette dernière ici, et Prophet OS ne la fait pas non
          # plus — il écrit la projection depuis le parent (ADR-0005). Tester --map-root-user
          # reviendrait à exiger ce que le système ne fait volontairement pas.
          if ! unshare --user true; then
            echo "::error::espaces de noms utilisateur indisponibles : les tests de niveau 0 se"
            echo "::error::contenteraient de se taire, et le vert de « check » ne prouverait rien."
            exit 1
          fi
          # `unshare` figure dans les profils AppArmor livrés par Ubuntu : il passe même sous
          # restriction. La garde le vérifierait donc avec succès pendant que tout le reste
          # échoue. On contrôle aussi le réglage lui-même.
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -f "$restriction" ] && [ "$(cat "$restriction")" = "1" ]; then
            echo "::error::la restriction AppArmor des espaces de noms est toujours active :"
            echo "::error::les niveaux 0 et 1 échoueront sur EACCES, quoi que dise unshare."
            exit 1
          fi
          echo "espaces de noms utilisateur disponibles, sans restriction de politique"

      - name: Installer gVisor
        run: sudo ./tools/install-isolation.sh gvisor

      # Une installation ratée ferait glisser le niveau 1 en « non vérifiable », et le job
      # passerait au vert sans avoir rien prouvé. Sur ce coureur, gVisor doit être là : on l'exige
      # plutôt que de laisser le silence tenir lieu de résultat.
      - name: Exiger gVisor
        run: |
          command -v runsc >/dev/null || {
            echo "::error::gVisor devait être installé sur ce coureur et ne l'est pas ;"
            echo "::error::sans cette exigence, le niveau 1 deviendrait « non vérifiable » en silence."
            exit 1
          }
          runsc --version

      # Le niveau 2 dépend d'artefacts publiés par un tiers, dont les chemins bougent. On essaie,
      # et si les images ne viennent pas le script de vérification le rangera en « non vérifiable »
      # — ce qui est dit dans le rapport, jamais compté réussi.
      - name: Installer Firecracker et les images d'invité (au mieux)
        continue-on-error: true
        # /dev/kvm est présent sur ce coureur mais appartient au groupe kvm, dont l'utilisateur
        # courant ne fait pas partie : Firecracker mourait sur EACCES. Le coureur est jetable,
        # l'accès est donc accordé explicitement.
        run: PROPHET_AUTORISER_KVM=1 sudo -E ./tools/install-isolation.sh microvm

      # L'invité du dépôt (ADR 0038), celui que l'image installée sert, plutôt que la racine
      # Ubuntu téléchargée à l'étape précédente : c'est lui que le niveau 2 doit démarrer.
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
      - name: Le noyau et la racine d'invité du dépôt
        run: |
          nix build .#invite-microvm --print-build-logs -o invite-microvm
          ls -lL invite-microvm/
          {
            echo "PROPHET_MICROVM_KERNEL=$PWD/invite-microvm/vmlinux"
            echo "PROPHET_MICROVM_ROOTFS=$PWD/invite-microvm/rootfs.squashfs"
          } >> "$GITHUB_ENV"

      - name: Niveaux d'isolation
        run: ./tools/verify-on-host.sh --niveaux
        env:
          RAPPORT: rapport-isolation.md

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-isolation
          path: rapport-isolation.md

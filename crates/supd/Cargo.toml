[package]
name = "supd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Adaptateur de la session humaine : les applications GTK et Qt lues et pilotées par leur arbre AT-SPI, et les clients officiels de l'humain lancés sur une mission, pour le service."

[[bin]]
name = "prophet-supd"
path = "src/bin/prophet-supd.rs"

[dependencies]
sup = { workspace = true }
prophet-ipc = { workspace = true }
providers = { workspace = true }
nix = { version = "0.29", features = ["signal", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { version = "5", default-features = false, features = ["tokio"] }
atspi-proxies = { version = "0.13", default-features = false }
atspi-common = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

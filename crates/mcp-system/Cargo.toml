[package]
name = "mcp-system"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Serveurs MCP système de Prophet OS : les outils par lesquels tout agent agit sur la machine."

[[bin]]
name = "prophet-mcp"
path = "src/bin/prophet-mcp.rs"

[dependencies]
prophet-types = { workspace = true }
prophet-ipc = { workspace = true }
capd = { workspace = true }
sfs = { workspace = true }
egress = { workspace = true }
vault = { workspace = true }
ledger = { workspace = true }
memoryd = { workspace = true }
providers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
blake3 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ed25519-dalek = { workspace = true }
# Lecture des formats (doc.read) : bureautique par l'archive et son XML, images par leurs en-têtes.
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
rand = { workspace = true }
rustix = { workspace = true }
base64 = { workspace = true }
browser-bridge = { workspace = true }
sup = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
vault = { workspace = true }

[lints]
workspace = true

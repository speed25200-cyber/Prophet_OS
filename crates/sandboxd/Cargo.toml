[package]
name = "sandboxd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sandbox Manager de Prophet OS : isolation graduée, du confinement léger à la microVM."

[[bin]]
name = "prophet-sandbox-helper"
path = "src/bin/helper.rs"

[dependencies]
prophet-types = { workspace = true }
capd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
nix = { version = "0.29", features = ["sched", "mount", "user", "process", "fs", "signal"] }
seccompiler = "0.4"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

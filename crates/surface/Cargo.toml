[package]
name = "surface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "La surface d'observation de Prophet OS : ce que l'humain voit pendant que les agents travaillent"

[dependencies]
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
prophet-ipc = { workspace = true }
prophet-types = { workspace = true }
agentd = { workspace = true }
providers = { workspace = true }
capd = { workspace = true }
shell = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
ulid = { workspace = true }

wgpu = "30"
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", default-features = false }
egui-winit = { version = "0.36.2", default-features = false, features = ["wayland", "clipboard", "accesskit"] }
glyphon = "0.12"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.17"
# Fenêtre et évènements. Wayland seul : Prophet OS n'embarque pas de serveur X.
winit = { version = "0.30", default-features = false, features = ["wayland", "wayland-dlopen", "rwh_06"] }

[dev-dependencies]
prophet-daemon = { workspace = true, features = ["essai"] }
tempfile = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
